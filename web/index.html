<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23050505'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='42' fill='%2300D4FF' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E" />
    <title>Tiraboschi POS / ERP</title>
    <!-- Diagnostic classique (s'exécute toujours, même si le module ES échoue) -->
    <script>
      window.__errs = [];
      // capture:true attrape aussi les erreurs de CHARGEMENT de ressources (script/css)
      window.addEventListener('error', function (e) {
        var t = e.target || {};
        window.__errs.push((e.message || 'load-error') + ' @ ' + (e.filename || t.src || t.href || ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        window.__errs.push('promise: ' + ((e.reason && e.reason.message) || String(e.reason)));
      });
      setTimeout(function () {
        var r = document.getElementById('root');
        if (!r || r.children.length > 0) return;
        var s = document.querySelector('script[type="module"]');
        var src = s ? s.src : '(aucun script module)';
        function show(extra) {
          r.innerHTML =
            '<pre style="color:#b3261e;white-space:pre-wrap;word-break:break-word;padding:16px;font:13px monospace;background:#fff">' +
            "Diagnostic : module non exécuté (#root vide).\n\nsrc: " + src +
            '\n\nErreurs : ' + (window.__errs.join(' | ') || '(aucune)') +
            '\n\nUA : ' + navigator.userAgent + (extra || '') + '</pre>';
        }
        show('\n\n(tests en cours…)');
        if (s) {
          fetch(src).then(function (resp) {
            var ct = resp.headers.get('content-type');
            // import() dynamique : révèle l'erreur de parsing/exécution (le <script> ne la donne pas)
            import(src).then(function () {
              show('\n\nFETCH 200 ct=' + ct + '\nIMPORT: OK (le module fonctionne via import dynamique)');
            }).catch(function (err) {
              show('\n\nFETCH 200 ct=' + ct + '\nIMPORT erreur: ' +
                (err && err.message ? err.message : String(err)) + '\n' + (err && err.stack ? err.stack : ''));
            });
          }).catch(function (err) { show('\n\nFETCH erreur: ' + err.message); });
        }
      }, 4000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
